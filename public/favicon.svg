<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#19D3F3"/>
      <stop offset="48%" stop-color="#2E7BFF"/>
      <stop offset="100%" stop-color="#8A35FF"/>
